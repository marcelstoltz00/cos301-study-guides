<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ST2 Example 2 · COS301 Mock Paper</title>
<style>
/* ============================================================
   CT3 Study Guides — shared dark academic theme
   Identical across every lecture file. Edit here, regenerate all.
   ============================================================ */

:root {
  --bg: #0b0e11;
  --surface: #12161b;
  --card: #1a1f26;
  --card-border: #262d37;
  --text: #e8ecf1;
  --text-dim: #9aa4b2;
  --text-faint: #626d7a;
  --accent: #4a90f8;
  --accent-dim: #2c5aa8;
  --success: #22c55e;
  --success-bg: rgba(34, 197, 94, 0.12);
  --warning: #f59e0b;
  --error: #f56363;
  --error-bg: rgba(245, 99, 99, 0.12);
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --duration-fast: 150ms;
  --duration-normal: 250ms;
  --easing: cubic-bezier(0.2, 0, 0, 1);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--accent-dim); color: #fff; }

/* ---------- Nav ---------- */

.topnav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(11, 14, 17, 0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--card-border);
}

.topnav-inner {
  max-width: 980px;
  margin: 0 auto;
  padding: var(--space-3) var(--space-6);
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.topnav-brand {
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.02em;
  color: var(--text);
  text-decoration: none;
  white-space: nowrap;
}

.topnav-brand span { color: var(--accent); }

.topnav-links {
  display: flex;
  gap: var(--space-1);
  overflow-x: auto;
  scrollbar-width: thin;
  flex: 1;
}

.topnav-links::-webkit-scrollbar { height: 4px; }
.topnav-links::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 2px; }

.topnav-links a {
  flex: none;
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  transition: background var(--duration-fast) var(--easing), color var(--duration-fast) var(--easing);
}

.topnav-links a:hover { background: var(--card); color: var(--text); }
.topnav-links a.active { background: var(--accent-dim); color: #fff; }

/* ---------- Layout ---------- */

.page {
  max-width: 860px;
  margin: 0 auto;
  padding: var(--space-8) var(--space-6) 120px;
}

.hero {
  margin-bottom: var(--space-8);
}

.hero-eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent);
  margin-bottom: var(--space-2);
}

.hero h1 {
  font-size: 30px;
  line-height: 1.25;
  margin: 0 0 var(--space-2);
  letter-spacing: -0.01em;
}

.hero p {
  color: var(--text-dim);
  font-size: 16px;
  margin: 0;
}

.section-tabs {
  display: flex;
  gap: var(--space-2);
  margin-bottom: var(--space-6);
  border-bottom: 1px solid var(--card-border);
  position: sticky;
  top: 53px;
  background: var(--bg);
  z-index: 50;
  padding-top: var(--space-2);
}

.section-tab {
  padding: var(--space-2) var(--space-4);
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color var(--duration-fast) var(--easing);
}

.section-tab:hover { color: var(--text); }
.section-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.section-panel { display: none; }
.section-panel.active { display: block; animation: fadein var(--duration-normal) var(--easing); }

@keyframes fadein {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- Content (rendered markdown) ---------- */

.content h2 {
  font-size: 22px;
  margin: var(--space-8) 0 var(--space-4);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--card-border);
  letter-spacing: -0.005em;
}
.content h2:first-child { margin-top: 0; }

.content h3 {
  font-size: 17px;
  color: var(--accent);
  margin: var(--space-6) 0 var(--space-2);
}

.content p { color: var(--text); margin: 0 0 var(--space-4); }
.content strong { color: #fff; font-weight: 600; }
.content ul, .content ol { margin: 0 0 var(--space-4); padding-left: 22px; color: var(--text); }
.content li { margin-bottom: var(--space-1); }
.content li strong { color: var(--text); }

.content code {
  font-family: var(--font-mono);
  font-size: 0.87em;
  background: var(--card);
  border: 1px solid var(--card-border);
  padding: 1px 5px;
  border-radius: var(--radius-sm);
  color: #ffd479;
}

.content pre {
  background: var(--surface);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  overflow-x: auto;
  margin: 0 0 var(--space-4);
}

.content pre code {
  background: none;
  border: none;
  padding: 0;
  color: #d8dee9;
  font-size: 13px;
  line-height: 1.55;
}

.content table {
  width: 100%;
  border-collapse: collapse;
  margin: 0 0 var(--space-4);
  font-size: 14px;
  display: block;
  overflow-x: auto;
}

.content th, .content td {
  border: 1px solid var(--card-border);
  padding: var(--space-2) var(--space-3);
  text-align: left;
  vertical-align: top;
}

.content th {
  background: var(--card);
  color: var(--accent);
  font-weight: 600;
  white-space: nowrap;
}

.content tr:nth-child(even) td { background: rgba(255,255,255,0.015); }

.content hr {
  border: none;
  border-top: 1px solid var(--card-border);
  margin: var(--space-8) 0;
}

.content blockquote {
  margin: 0 0 var(--space-4);
  padding: var(--space-3) var(--space-4);
  background: var(--card);
  border-left: 3px solid var(--warning);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--text-dim);
  font-size: 14px;
}
.content blockquote p:last-child { margin-bottom: 0; }
.content blockquote strong { color: var(--text); }

/* ---------- Diagrams ---------- */

.diagram {
  margin: 0 0 var(--space-6);
  padding: var(--space-4);
  background: var(--surface);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  overflow-x: auto;
  text-align: center;
}
.diagram svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
.diagram-caption {
  margin-top: var(--space-3);
  font-size: 12.5px;
  color: var(--text-faint);
  font-style: italic;
}

/* ---------- TL;DR box ---------- */

.tldr-box {
  background: linear-gradient(135deg, rgba(74,144,248,0.10), rgba(74,144,248,0.03));
  border: 1px solid var(--accent-dim);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  margin-bottom: var(--space-8);
}
.tldr-box-header {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}
.tldr-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #fff;
  background: var(--accent);
  padding: 2px 8px;
  border-radius: 999px;
}
.tldr-box-header span.label { font-size: 13px; color: var(--text-dim); font-weight: 600; }
.tldr-box ul { margin: 0; padding-left: 20px; }
.tldr-box li { margin-bottom: 6px; color: var(--text); font-size: 14.5px; }
.tldr-box li:last-child { margin-bottom: 0; }
.tldr-box li strong { color: #fff; }
.tldr-box code {
  font-family: var(--font-mono);
  font-size: 0.87em;
  background: var(--card);
  border: 1px solid var(--card-border);
  padding: 1px 5px;
  border-radius: var(--radius-sm);
  color: #ffd479;
}

/* ---------- Flashcards ---------- */

.flash-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: var(--space-4);
}

.flash-card {
  perspective: 1200px;
  height: 160px;
  cursor: pointer;
}

.flash-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 400ms;
  transform-style: preserve-3d;
}
.flash-card.flipped .flash-card-inner { transform: rotateY(180deg); }

.flash-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: var(--radius-lg);
  border: 1px solid var(--card-border);
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.flash-front {
  background: var(--surface);
  align-items: flex-start;
  justify-content: center;
  position: relative;
}
.flash-front .flash-term { font-size: 16px; font-weight: 700; color: var(--text); }
.flash-front .flash-hint { margin-top: auto; font-size: 11px; color: var(--text-faint); }
.flash-back {
  background: var(--card);
  border-color: var(--accent-dim);
  transform: rotateY(180deg);
  justify-content: center;
}
.flash-back .flash-def { font-size: 13.5px; color: var(--text-dim); line-height: 1.5; }
.flash-back .flash-def code {
  font-family: var(--font-mono);
  font-size: 0.9em;
  background: var(--surface);
  border: 1px solid var(--card-border);
  padding: 1px 5px;
  border-radius: var(--radius-sm);
  color: #ffd479;
}

.flash-card.known .flash-front { border-color: var(--success); }
.flash-card.known .flash-front::after {
  content: "✓ known";
  position: absolute;
  top: 10px;
  right: 12px;
  font-size: 11px;
  color: var(--success);
  font-family: var(--font-mono);
}

.flash-know-btn {
  margin-top: var(--space-2);
  align-self: flex-start;
  font-size: 12px;
  padding: 4px 10px;
}

/* ---------- Quiz (MCQ) ---------- */

.quiz-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  margin-bottom: var(--space-6);
  flex-wrap: wrap;
}

.quiz-score {
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--text-dim);
}
.quiz-score b { color: var(--text); }

.progress-bar {
  height: 6px;
  background: var(--card);
  border-radius: 999px;
  overflow: hidden;
  flex: 1;
  min-width: 120px;
}
.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 999px;
  transition: width var(--duration-normal) var(--easing);
}

.btn {
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 600;
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-sm);
  border: 1px solid var(--card-border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: background var(--duration-fast) var(--easing), border-color var(--duration-fast) var(--easing);
}
.btn:hover { background: #232a33; border-color: #38414d; }
.btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-accent:hover { background: #3a7de0; }

.mcq-card {
  background: var(--surface);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  margin-bottom: var(--space-4);
}

.mcq-q {
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 var(--space-4);
  display: flex;
  gap: var(--space-2);
}

.mcq-q .mcq-index {
  color: var(--accent);
  font-family: var(--font-mono);
  flex: none;
}

.mcq-options { display: flex; flex-direction: column; gap: var(--space-2); }

.mcq-option {
  text-align: left;
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  border: 1px solid var(--card-border);
  background: var(--card);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  cursor: pointer;
  transition: border-color var(--duration-fast) var(--easing), background var(--duration-fast) var(--easing);
}

.mcq-option:hover:not(:disabled) { border-color: var(--accent); }
.mcq-option:disabled { cursor: default; }

.mcq-option.correct { background: var(--success-bg); border-color: var(--success); color: #baf7cf; }
.mcq-option.incorrect { background: var(--error-bg); border-color: var(--error); color: #ffc9c9; }
.mcq-option.reveal-correct { border-color: var(--success); color: #baf7cf; }

.mcq-explanation {
  margin-top: var(--space-4);
  padding: var(--space-3) var(--space-4);
  background: var(--card);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 13.5px;
  color: var(--text-dim);
  display: none;
}
.mcq-explanation.show { display: block; animation: fadein var(--duration-normal) var(--easing); }
.mcq-explanation b { color: var(--text); }

/* ---------- Tech questions ---------- */

.tech-card {
  background: var(--surface);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  margin-bottom: var(--space-4);
}

.tech-q-row {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  justify-content: space-between;
}

.tech-q {
  font-size: 15px;
  font-weight: 600;
  margin: 0;
  flex: 1;
  display: flex;
  gap: var(--space-2);
}
.tech-q .mcq-index { color: var(--accent); font-family: var(--font-mono); flex: none; }

.tech-reviewed-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-faint);
  flex: none;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.tech-reviewed-label input { accent-color: var(--accent); }

.tech-answer {
  margin-top: var(--space-4);
  padding-top: var(--space-4);
  border-top: 1px solid var(--card-border);
  display: none;
  font-size: 14px;
  color: var(--text-dim);
}
.tech-answer.show { display: block; animation: fadein var(--duration-normal) var(--easing); }
.tech-answer p { margin: 0 0 var(--space-3); color: var(--text-dim); }
.tech-answer ul { margin: 0 0 var(--space-3); padding-left: 20px; }
.tech-answer strong { color: var(--text); }
.tech-answer code {
  font-family: var(--font-mono);
  font-size: 0.87em;
  background: var(--card);
  border: 1px solid var(--card-border);
  padding: 1px 5px;
  border-radius: var(--radius-sm);
  color: #ffd479;
}

.reveal-btn {
  margin-top: var(--space-4);
}

/* ---------- Footer ---------- */

.page-footer {
  margin-top: var(--space-8);
  padding-top: var(--space-6);
  border-top: 1px solid var(--card-border);
  display: flex;
  justify-content: space-between;
  gap: var(--space-4);
  flex-wrap: wrap;
}

.page-footer a {
  color: var(--text-dim);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
}
.page-footer a:hover { color: var(--accent); }

@media (max-width: 640px) {
  .page { padding: var(--space-6) var(--space-4) 100px; }
  .hero h1 { font-size: 24px; }
  .section-tabs { top: 49px; flex-wrap: wrap; }
  .section-tab { flex: 1 1 calc(50% - var(--space-2)); }
}

.mock-page { max-width: 1000px; }
.mock-hero { border: 1px solid #35547c; border-radius: 14px; padding: 24px; background: linear-gradient(145deg, #142132, #12161b); }
.mock-kicker { color: #a4caff; font: 12px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; }
.mock-hero h1 { margin: 12px 0; font-size: clamp(28px, 5vw, 42px); }
.mock-hero p { color: #c1cedf; }
.mock-toolbar, .mock-jumps { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
.mock-jumps a { padding: 6px 10px; border-radius: 7px; background: #182b42; color: #cce0ff; text-decoration: none; font-size: 13px; }
.mock-score { padding: 16px; background: #0e1826; border-radius: 10px; display: grid; gap: 8px; }
.mock-instructions summary, .mock-memo summary { cursor: pointer; padding: 10px 0; color: #b8d5ff; font-weight: 600; }
.mock-instructions a { color: #b8d5ff; }
.mock-note { font-size: 13px; color: #b4c1d3; }
.mock-question { margin: 24px 0; padding: 24px; background: #121a25; border: 1px solid #33465f; border-radius: 12px; scroll-margin-top: 80px; overflow-wrap: anywhere; }
.mock-qhead { display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; align-items: baseline; }
.mock-qhead h2 { margin: 0; font-size: 22px; }
.mock-marks { color: #acd0ff; font: 13px var(--font-mono); }
.mock-type { color: #b4c1d3; font-size: 13px; }
.mock-prompt { white-space: pre-line; }
.mock-diagram { margin: 20px 0; overflow-x: auto; border: 1px solid #52657e; border-radius: 10px; }
.mock-diagram svg { display: block; width: 100%; min-width: 680px; height: auto; }
.mock-question fieldset { border: 0; padding: 0; margin: 18px 0; min-width: 0; }
.mock-question legend { font-weight: 600; margin-bottom: 12px; }
.mock-option { display: flex; gap: 12px; align-items: flex-start; padding: 12px; margin-bottom: 8px; background: #192535; border: 1px solid #415b7c; border-radius: 8px; cursor: pointer; }
.mock-option input { margin-top: 5px; flex: none; accent-color: #75afff; }
.mock-row, .mock-part { margin: 20px 0; }
.mock-row label, .mock-part label { display: block; margin-bottom: 10px; font-weight: 500; }
.mock-row select, .mock-row input, .mock-part textarea, .mock-self input { font: inherit; color: #e8ecf1; background: #0b1421; border: 1px solid #526c8f; border-radius: 7px; padding: 10px; max-width: 100%; }
.mock-row select, .mock-row input { width: 100%; }
.mock-part textarea { display: block; width: 100%; min-height: 140px; resize: vertical; line-height: 1.6; }
.mock-result { margin: 16px 0; padding: 14px; background: #142942; border-left: 3px solid #83b5ff; border-radius: 7px; }
.mock-memo { border-top: 1px solid #33465f; margin-top: 18px; padding-top: 8px; }
.mock-memo h3 { font-size: 17px; }
.mock-memo li { margin-bottom: 6px; }
.mock-self { margin: 12px 0; padding: 14px; border: 1px dashed #5e7ca2; border-radius: 7px; }
.mock-self label { display: block; margin-bottom: 8px; }
.mock-self input { width: 110px; }
.mock-invalid { color: #ffbec3; }
.mock-word-count { color: #b4c1d3; font: 12px var(--font-mono); }
.mock-print-space { display: none; }
.mock-question :focus-visible, .mock-hero :focus-visible { outline: 3px solid #edc878; outline-offset: 3px; }
@media (max-width: 640px) {
 .mock-hero, .mock-question { padding: 16px; }
 .mock-diagram svg { min-width: 680px; }
 .mock-toolbar .btn { flex: 1 1 140px; }
}
@media print {
 @page { margin: 16mm; }
 html, body { background: white !important; color: black !important; font-size: 11pt; }
 .page { max-width: none; margin: 0; padding: 0; }
 .topnav, .mock-toolbar, .mock-jumps, .mock-score, #storage-status, .page-footer, .mock-self, .mock-word-count, .mock-result, .mock-question > .btn, .mock-instructions { display: none !important; }
 .mock-hero, .mock-question { background: white !important; border: 0; box-shadow: none; padding: 0; border-radius: 0; }
 .mock-hero { border-bottom: 2px solid black; padding-bottom: 12px; }
 .mock-hero p, .mock-question *, .mock-marks { color: black; }
 .mock-question { break-inside: auto; }
 .mock-qhead, .mock-question h3, .mock-row label, .mock-part label { break-after: avoid; }
 .mock-row, .mock-option, .mock-diagram { break-inside: avoid; }
 .mock-option { background: white; border: 1px solid #aaa; padding: 6px; }
 .mock-option input { display: none; }
 .mock-option::before { content: '□'; }
 .mock-row input, .mock-row select, .mock-part textarea { display: none; }
 .mock-print-space { display: block; min-height: 25px; border-bottom: 1px solid #888; margin: 8px 0 18px; }
 .mock-part .mock-print-space { min-height: 90px; }
 .mock-diagram { overflow: visible; }

<script type="application/json" id="mock-data">{"id": "st2-example-2", "title": "ST2 Example 2", "scope": "L17\u2013L33 and L35, including SOA and Microservices", "reference": "ST1.html", "totalMarks": 36, "questions": [{"type": "essay", "marks": 10, "prompt": "An exhibition platform manages Exhibitions, Bookings and Visitors. Each booking belongs to exactly one visitor and one exhibition. A visitor can hold multiple historical bookings. An exhibition has a capacity and cannot accept more active bookings than that capacity. A visitor\u2019s address may change without changing their identity. Each booking contains a quoted Money value consisting of amount and currency. Curators manage exhibitions. Separate your answers with blank lines.", "parts": [{"prompt": "1. Identify six plausible domain concepts, including at least one value object. (3 marks)", "marks": 3, "answer": "Exhibition, Booking, Visitor, Curator, Money and Address are plausible. Money or Address can be modelled as a value object when identity is defined by its constituent values.", "rubric": ["0.5 each: six grounded concepts, with at least one defensible value object."]}, {"prompt": "2. For any four concepts, give two suitable attributes each. (2 marks)", "marks": 2, "answer": "Exhibition: exhibitionId, capacity. Booking: bookingId, status. Visitor: visitorId, name. Money: amount, currency.", "rubric": ["0.5 per concept with two suitable attributes, for four concepts."]}, {"prompt": "3. Explain two associations and distinguish Visitor identity from Money equality. (3 marks)", "marks": 3, "answer": "Each Booking refers to one Visitor and one Exhibition; each may have many historical Bookings. Visitor identity persists after its address changes. Two Money values are equal by amount and currency under the chosen representation.", "rubric": ["1 each: two correct associations.", "1: identity versus value distinction using the scenario."]}, {"prompt": "4. State two multiplicities and express the active-capacity constraint separately. (2 marks)", "marks": 2, "answer": "Visitor 1 to Booking 0..*; Exhibition 1 to Booking 0..* over history. Active bookings for an exhibition must not exceed its capacity; a fixed history multiplicity is not a substitute for that invariant.", "rubric": ["1: both multiplicities correct.", "1: active capacity expressed as a business invariant rather than an incorrect fixed history count."]}], "topics": ["L18"], "id": "q2", "number": 1}, {"type": "matching", "marks": 4, "prompt": "Match each architectural concept to the distinction it captures.", "options": ["Other services use the owning service boundary rather than querying its tables directly", "A business action that counteracts a completed local step where possible", "Separate processes or deployments that remain tightly coupled in change or operation", "Consumers depend on an agreed interface rather than provider internals"], "items": [{"prompt": "Service contract", "answer": "Consumers depend on an agreed interface rather than provider internals", "explanation": "Service contract: Consumers depend on an agreed interface rather than provider internals."}, {"prompt": "Database ownership per service", "answer": "Other services use the owning service boundary rather than querying its tables directly", "explanation": "Database ownership per service: Other services use the owning service boundary rather than querying its tables directly."}, {"prompt": "Saga compensation", "answer": "A business action that counteracts a completed local step where possible", "explanation": "Saga compensation: A business action that counteracts a completed local step where possible."}, {"prompt": "Distributed monolith", "answer": "Separate processes or deployments that remain tightly coupled in change or operation", "explanation": "Distributed monolith: Separate processes or deployments that remain tightly coupled in change or operation."}], "topics": ["L25", "SOA", "MS"], "id": "q3", "number": 2}, {"type": "essay", "marks": 6, "prompt": "For each scenario, choose the most suitable primary mechanism from cross-domain replica, historical backup/restore, idempotent processing, or none of the above. Give one sentence explaining the distinguishing property needed. Marks: one for the choice and one for the justification.", "parts": [{"prompt": "1. A mistaken deletion has already propagated to all live database replicas; valid records from before the deletion are needed. (2 marks)", "marks": 2, "answer": "Historical backup/restore: an earlier recoverable state is needed because current replicas contain the same deletion.", "rubric": ["1: historical backup/restore or point-in-time recovery.", "1: explains why current replicas do not preserve the required history."]}, {"prompt": "2. A payment message is delivered again after the worker recorded success but lost its queue acknowledgement. (2 marks)", "marks": 2, "answer": "Idempotent processing: stable operation identity and duplicate handling prevent repetition of the completed business effect.", "rubric": ["1: idempotent processing.", "1: links repeated delivery/uncertain acknowledgement to one intended effect."]}, {"prompt": "3. A user with a valid session can read records belonging to another tenant. (2 marks)", "marks": 2, "answer": "None of the above: the primary missing control is server-side object/tenant authorisation.", "rubric": ["1: none of the above.", "1: explains the resource-scope access rule rather than availability or duplicate handling."]}], "topics": ["L28", "L29", "MS"], "id": "q4", "number": 3}, {"type": "matching", "marks": 4, "prompt": "Match each practice or concept to its direct purpose.", "options": ["The user\u2019s understanding of how the task and system work", "Security activities and learning throughout delivery and operation", "Manage changes that would otherwise break existing consumers", "Reusable implemented interface decisions and components"], "items": [{"prompt": "Design system", "answer": "Reusable implemented interface decisions and components", "explanation": "Design system: Reusable implemented interface decisions and components."}, {"prompt": "User mental model", "answer": "The user\u2019s understanding of how the task and system work", "explanation": "User mental model: The user\u2019s understanding of how the task and system work."}, {"prompt": "DevSecOps feedback", "answer": "Security activities and learning throughout delivery and operation", "explanation": "DevSecOps feedback: Security activities and learning throughout delivery and operation."}, {"prompt": "Contract versioning/migration", "answer": "Manage changes that would otherwise break existing consumers", "explanation": "Contract versioning/migration: Manage changes that would otherwise break existing consumers."}], "topics": ["L17", "L20", "L21", "L25"], "id": "q6", "number": 4}, {"type": "multi", "marks": 5, "prompt": "Which statements about software quality, testing and measurement are valid? Select all that apply. Negative marking applies.", "options": ["A static fault can exist without an observed failure on the inputs tested.", "SQA consists only of the final system test.", "Reducing mean repair time can improve availability without increasing mean operating time.", "Replacing the integration boundary with a mock proves that real boundary works.", "A predictor metric needs contextual interpretation rather than being treated as proof.", "Regression testing can include performance and security checks.", "A requirement stated as \u201cerrors below 1%\u201d is satisfied by exactly 1% errors.", "A long-running soak test can reveal resource accumulation missed by a short test.", "A red-team exercise can ignore agreed authorisation and scope because realistic attacks are its goal."], "correct": [0, 2, 4, 5, 7], "explanation": "These distinctions separate defects from observations, process assurance from testing, and useful metrics from overclaims. Strict thresholds, real integration and assertion quality need explicit attention. Security exercises still need agreed authorisation and scope.", "topics": ["L19", "L30", "L32", "L24"], "id": "q7", "number": 5}, {"type": "short", "marks": 2, "prompt": "For each scenario, write only the most specific testing term. Use the explicitly stated purpose.", "items": [{"prompt": "1. Demand jumps abruptly from 20 requests/s to 800 requests/s and then drops, to observe the response to sudden change.", "answers": ["spike testing", "spike"], "explanation": "The distinguishing feature is the abrupt load change."}, {"prompt": "2. Testers keep increasing demand beyond the known sustainable capacity to inspect overload failure and subsequent recovery.", "answers": ["stress testing", "stress"], "explanation": "The explicit purpose is behaviour beyond capacity, not merely an expected large workload."}], "topics": ["L32"], "id": "q8", "number": 6}, {"type": "essay", "marks": 5, "prompt": "A university operates a large media-processing platform. Upload validation, transcoding and catalogue browsing have different scaling demands. Separate experienced teams own the capabilities, need independent releases and can support distributed operations. Long-running transcoding should not block acceptance of valid uploads. The system must expose an accurate processing status to users.", "parts": [{"prompt": "1. Recommend an architectural approach and name the communication style suitable for the long-running work. (2 marks)", "marks": 2, "answer": "Services aligned with independently owned capabilities, with asynchronous queued/event-driven transcoding. A well-justified microservices approach fits independent release and scaling requirements.", "rubric": ["1: suitable independently deployable service approach.", "1: asynchronous queued/event-driven long-running processing."]}, {"prompt": "2. Give three scenario-specific reasons, including one limitation or cost the team must handle. (3 marks)", "marks": 3, "answer": "Separate transcoding capacity can scale without duplicating the whole platform. Service boundaries support the teams\u2019 independent release cadence. Asynchronous work requires pending/completed states, duplicate handling, monitoring and recovery rather than assuming immediate success.", "rubric": ["1: independent capacity linked to workload differences.", "1: independent release/ownership linked to teams.", "1: relevant async/distributed cost and its consequence; accept other well-supported trade-offs."]}], "topics": ["L20", "L23", "L28", "SOA", "MS"], "id": "q11", "number": 7}], "storageKey": "cos301-st2-example-2-v1", "notes": "Original practice paper based on the reference assessment style. Not an official paper or prediction. No official duration was available in the supplied export.", "multiRule": "Each correct selection earns the question marks divided by the number of correct options. Each incorrect selection deducts the same amount. Omitted options earn zero. Each question is floored at zero. This explicit practice rule is not asserted to be the original marking formula."}</script>
<script>
(function () {
 'use strict';
 const paper = JSON.parse(document.getElementById('mock-data').textContent);
 const node = (tag, cls, text) => {const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
 const normal = s => String(s ?? '').trim().toLowerCase().replace(/\s+/g,' ').replace(/\.$/,'');
 const fmt = n => Number(n.toFixed(2)).toString();
 let state = {};
 try {const saved=JSON.parse(localStorage.getItem(paper.storageKey));if(saved && typeof saved==='object'&&!Array.isArray(saved))state=saved;}catch{}
 const status=document.getElementById('storage-status');
 const markViews=new Map();const memoElements=[];const wordViews=[];
 function save(){try{localStorage.setItem(paper.storageKey,JSON.stringify(state));status.textContent='Drafts, selections and self-assessment save locally for this paper.';}catch{status.textContent='Browser storage is unavailable. You can still practise, but this session’s work may not survive a reload.';}}
 function current(q){
  if(!state[q.id]||typeof state[q.id]!=='object'||Array.isArray(state[q.id]))state[q.id]={};
  const s=state[q.id];
  for(const key of ['answers','drafts','selfMarks'])if(!Array.isArray(s[key]))s[key]=[];
  if(q.options&&['single','multi'].includes(q.type)){
   s.answers=[...new Set(s.answers.filter(x=>Number.isInteger(x)&&x>=0&&x<q.options.length))];
   if(q.type==='single')s.answers=s.answers.slice(0,1);
  }
  return s;
 }
 function score(q){
  const s=current(q);
  if(q.type==='single')return s.answers.length===1&&s.answers[0]===q.correct[0]?q.marks:0;
  if(q.type==='multi'){
   const hits=s.answers.filter(i=>q.correct.includes(i)).length;
   return Math.max(0,(hits-(s.answers.length-hits))*q.marks/q.correct.length);
  }
  return q.items.reduce((sum,item,i)=>sum+(q.type==='matching'?s.answers[i]===item.answer:item.answers.some(a=>normal(a)===normal(s.answers[i]))) * q.marks/q.items.length,0);
 }
 function updateScore(){
  const objective=paper.questions.filter(q=>q.type!=='essay'),written=paper.questions.filter(q=>q.type==='essay');
  const objectiveMax=objective.reduce((s,q)=>s+q.marks,0);const writtenMax=written.reduce((s,q)=>s+q.marks,0);
  const graded=objective.filter(q=>current(q).marked===true);const obj=graded.reduce((s,q)=>s+score(q),0);
  let self=0, assessed=0,partCount=0;
  written.forEach(q=>q.parts.forEach((p,i)=>{partCount++;const value=current(q).selfMarks[i];if(typeof value==='number'&&Number.isFinite(value)&&value>=0&&value<=p.marks&&Number.isInteger(value*2)){self+=value;assessed++;}}));
  const target=document.getElementById('paper-score');target.replaceChildren(node('div','',`Objective: ${fmt(obj)} / ${fmt(objectiveMax)} marks · ${graded.length} / ${objective.length} questions marked`));
  if(written.length){target.append(node('div','',`Written answers (self-assessed): ${fmt(self)} / ${fmt(writtenMax)} marks · ${assessed} / ${partCount} parts assessed`),node('strong','',`Combined practice total: ${fmt(obj+self)} / ${paper.totalMarks}`),node('div','mock-note','Unmarked work contributes zero to this running total. Written-answer marks are your assessment, not an automated judgement.'));}
 }
 function mark(q){current(q).marked=true;save();markViews.get(q.id)?.();updateScore();}
 function change(q){current(q).marked=false;save();markViews.get(q.id)?.();updateScore();}
 function addText(parent,text){parent.append(node('p','',text));}
 function addMemo(card,q){
  const memo=node('details','mock-memo');memo.append(node('summary','','Model answer and marking guide'));
  if(q.type==='essay')q.parts.forEach((part,i)=>{
   memo.append(node('h3','',`Part ${i+1} · ${part.marks} marks`));addText(memo,part.answer);
   const list=node('ul');part.rubric.forEach(text=>list.append(node('li','',text)));memo.append(list);
   const self=node('div','mock-self');const label=node('label','',`Your self-assessed mark for part ${i+1} (0–${part.marks})`);const input=node('input');Object.assign(input,{type:'number',min:'0',max:String(part.marks),step:'0.5',id:`${q.id}-mark-${i}`});label.htmlFor=input.id;
   const value=current(q).selfMarks[i];if(typeof value==='number'&&Number.isFinite(value)&&value>=0&&value<=part.marks&&Number.isInteger(value*2))input.value=String(value);
   const msg=node('p','mock-note');msg.setAttribute('role','status');
   input.addEventListener('input',()=>{const valid=input.value!==''&&input.validity.valid&&Number.isFinite(input.valueAsNumber);current(q).selfMarks[i]=valid?input.valueAsNumber:null;input.setAttribute('aria-invalid',String(input.value!==''&&!valid));msg.textContent=input.value!==''&&!valid?`Enter 0 to ${part.marks} in half-mark steps. Invalid marks are not counted.`:'';save();updateScore();});
   self.append(label,input,msg);memo.append(self);
  });
  else if(q.type==='single'||q.type==='multi'){
   addText(memo,`Correct option${q.correct.length>1?'s':''}: ${q.correct.map(i=>String.fromCharCode(65+i)).join(', ')}.`);q.correct.forEach(i=>addText(memo,`${String.fromCharCode(65+i)}. ${q.options[i]}`));addText(memo,q.explanation);
   if(q.type==='multi')addText(memo,`Scoring: +${fmt(q.marks/q.correct.length)} per correct selection, −${fmt(q.marks/q.correct.length)} per incorrect selection; minimum 0, maximum ${q.marks}.`);
  }else q.items.forEach((item,i)=>{memo.append(node('h3','',`${i+1}. ${q.type==='matching'?item.answer:item.answers.join(' / ')} · ${fmt(q.marks/q.items.length)} marks`));addText(memo,item.explanation);});
  card.append(memo);memoElements.push(memo);
 }
 function renderQuestion(q){
  const s=current(q),card=node('section','mock-question');card.id=q.id;
  const head=node('div','mock-qhead');head.append(node('h2','',`Question ${q.number}`),node('span','mock-marks',`${fmt(q.marks)} mark${q.marks===1?'':'s'}`));card.append(head);
  const names={single:q.options?.length===2?'True / False':'Single answer',multi:'Select all that apply · negative marking',matching:'Matching',cloze:'Sentence completion',short:'Short answer / letter',essay:'Structured written response'};
  card.append(node('p','mock-type',names[q.type]),node('p','mock-prompt',q.prompt));
  if(q.diagram){const figure=node('div','mock-diagram');figure.innerHTML=q.diagram;card.append(figure);addText(card,'Diagram is part of the question. On a narrow screen, scroll it horizontally to read all labels.');}
  if(['single','multi'].includes(q.type)){
   const fieldset=node('fieldset');fieldset.append(node('legend','',q.type==='multi'?'Select all correct options':'Select one option'));
   q.options.forEach((text,i)=>{const label=node('label','mock-option');const input=node('input');input.type=q.type==='single'?'radio':'checkbox';input.name=q.id;input.checked=s.answers.includes(i);input.addEventListener('change',()=>{s.answers=q.type==='single'?[i]:input.checked?[...new Set([...s.answers,i])]:s.answers.filter(x=>x!==i);change(q);});label.append(input,node('span','',`${String.fromCharCode(65+i)}. ${text}`));fieldset.append(label);});card.append(fieldset);
  }else if(q.type==='essay'){
   q.parts.forEach((part,i)=>{const block=node('div','mock-part'),label=node('label','',part.prompt),textarea=node('textarea');textarea.id=`${q.id}-draft-${i}`;label.htmlFor=textarea.id;textarea.value=typeof s.drafts[i]==='string'?s.drafts[i]:'';textarea.addEventListener('input',()=>{s.drafts[i]=textarea.value;save();wordViews.forEach(fn=>fn());});block.append(label,textarea,node('div','mock-print-space'));card.append(block);});
   const word=node('p','mock-word-count');const update=()=>{const count=s.drafts.join(' ').trim().split(/\s+/).filter(Boolean).length;word.textContent=`${count} words${q.wordLimit?` · suggested maximum ${q.wordLimit}; no automatic penalty`:''}`;word.classList.toggle('mock-invalid',Boolean(q.wordLimit&&count>q.wordLimit));};wordViews.push(update);update();card.append(word);
  }else{
   if(q.type==='matching'){
    addText(card,'Choose the most precise match for each prompt. Each answer is intended to be used once; each row is marked independently.');
    card.append(node('p','mock-print-bank',`Answer bank: ${q.options.map((x,i)=>`${String.fromCharCode(65+i)}. ${x}`).join(' · ')}`));
   }
   q.items.forEach((item,i)=>{const row=node('div','mock-row'),label=node('label','',item.prompt);let input;
    if(q.type==='matching'){input=node('select');const blank=node('option','','Choose an answer');blank.value='';input.append(blank);q.options.forEach(text=>{const option=node('option','',text);option.value=text;input.append(option);});}
    else {input=node('input');input.type='text';input.autocomplete='off';}
    input.id=`${q.id}-answer-${i}`;label.htmlFor=input.id;input.value=typeof s.answers[i]==='string'?s.answers[i]:'';input.addEventListener(q.type==='matching'?'change':'input',()=>{s.answers[i]=input.value;change(q);});row.append(label,input,node('div','mock-print-space'));card.append(row);
   });
  }
  if(q.type!=='essay'){
   const check=node('button','btn','Mark this question');check.type='button';check.addEventListener('click',()=>mark(q));const feedback=node('div','mock-result');feedback.setAttribute('role','status');
   const update=()=>{feedback.hidden=s.marked!==true;feedback.textContent=s.marked===true?`${fmt(score(q))} / ${fmt(q.marks)} marks. Open the marking guide for the answer and reasoning. Changing a response clears this marking result.`:'';};markViews.set(q.id,update);update();card.append(check,feedback);
  }
  addMemo(card,q);document.getElementById('paper-questions').append(card);
  const jump=node('a','',`Q${q.number} · ${fmt(q.marks)}`);jump.href='#'+q.id;document.getElementById('question-links').append(jump);
 }
 document.getElementById('paper-scope').textContent=`Scope: ${paper.scope}`;
 document.getElementById('paper-meta').textContent=`${paper.questions.length} questions · ${paper.totalMarks} marks · attempt all questions. ${paper.notes}`;
 const instructions=document.getElementById('instructions');
 addText(instructions,`Style reference: ${paper.reference}. The questions and diagrams in this paper are newly authored. Saved responses in the reference export were not treated as an authoritative memorandum.`);
 addText(instructions,paper.multiRule);
 addText(instructions,'Matching rows and short-answer subparts share their question’s marks equally. Short answers ignore case, extra spaces and a final full stop; accepted alternatives are shown in the marking guide. Equivalent written reasoning may earn credit under the rubric. Use the rubric to review a defensible alternative the exact-match marker does not recognise.');
 addText(instructions,'Written responses are not automatically graded. Enter optional self-assessed marks after consulting the model answer. Any word maximum is practice guidance, not an automatically applied penalty. Blank printing omits your saved answers and all marking guides. Marking-guide printing includes the paper and model answers, without your private drafts.');
 addText(instructions,'Some topic guides are general coverage because lecture notes were unavailable. CT4 is limited to L28–L33 plus L35 revision. ST2 samples L17–L33 and L35, including existing SOA and Microservices material.');
 paper.questions.forEach(renderQuestion);updateScore();status.textContent='Drafts, selections and self-assessment save locally for this paper.';
 document.getElementById('mark-all').addEventListener('click',()=>{paper.questions.filter(q=>q.type!=='essay').forEach(q=>{current(q).marked=true;markViews.get(q.id)();});save();updateScore();});
 document.getElementById('show-memos').addEventListener('click',()=>memoElements.forEach(m=>m.open=true));
 document.getElementById('hide-memos').addEventListener('click',()=>memoElements.forEach(m=>m.open=false));
 document.getElementById('reset-paper').addEventListener('click',()=>{if(window.confirm('Clear only this paper’s answers, drafts and self-assessed marks?')){state={};save();location.reload();}});
 let printState=null;
 function restorePrint(){if(!printState)return;memoElements.forEach((m,i)=>m.open=printState[i]);document.body.classList.remove('print-memo');printState=null;}
 function printPaper(withMemo){printState=memoElements.map(m=>m.open);document.body.classList.toggle('print-memo',withMemo);memoElements.forEach(m=>m.open=withMemo);window.print();}
 addEventListener('afterprint',restorePrint);
 document.getElementById('print-paper').addEventListener('click',()=>printPaper(false));
 document.getElementById('print-memo').addEventListener('click',()=>printPaper(true));
})();

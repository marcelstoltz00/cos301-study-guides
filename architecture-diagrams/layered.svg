<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Layered architecture — four layers</title><desc id="desc">Layers are logical responsibilities: presentation, business, persistence and storage. Here closed layers call the adjacent layer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 480.0 92.0 L 480.0 145.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="480.0,145.0 485.0,133.0 475.0,133.0" fill="#566c7d"/><path d="M 480.0 207.0 L 480.0 260.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="480.0,260.0 485.0,248.0 475.0,248.0" fill="#566c7d"/><path d="M 480.0 322.0 L 480.0 375.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="480.0,375.0 485.0,363.0 475.0,363.0" fill="#566c7d"/><rect x="320" y="30" width="320" height="62" rx="8" fill="#eeeafd" stroke="#6751a6" stroke-width="2"/><text x="480.0" y="67.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Presentation layer</text><rect x="320" y="145" width="320" height="62" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="480.0" y="182.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Business / domain layer</text><rect x="320" y="260" width="320" height="62" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="480.0" y="297.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Persistence layer</text><rect x="320" y="375" width="320" height="62" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="480.0" y="412.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Database layer</text><rect x="536.0" y="104.5" width="48.0" height="22" rx="4" fill="white" opacity=".96"/><text x="560.0" y="119.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">input</text><rect x="496.4" y="219.5" width="127.2" height="22" rx="4" fill="white" opacity=".96"/><text x="560.0" y="234.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">store / retrieve</text><rect x="536.0" y="334.5" width="48.0" height="22" rx="4" fill="white" opacity=".96"/><text x="560.0" y="349.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">query</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Blue/green deployment</title><desc id="desc">Two application environments allow a verified new version to receive traffic while the old one is retained for controlled rollback.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 431.5 97.0 L 257.5 230.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="257.5,230.0 270.1,226.7 264.0,218.7" fill="#566c7d"/><path d="M 514.4 97.0 L 696.4 230.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="696.4,230.0 689.6,218.9 683.7,227.0" fill="#566c7d"/><path d="M 271.0 292.0 L 415.6 375.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="415.6,375.0 407.6,364.7 402.7,373.4" fill="#566c7d"/><path d="M 678.9 304.0 L 548.1 375.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="548.1,375.0 561.1,373.7 556.3,364.9" fill="#566c7d"/><rect x="390" y="35" width="164" height="62" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="472.0" y="72.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Traffic switch</text><rect x="135" y="230" width="164" height="62" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="217.0" y="257.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Blue environment</text><text x="217.0" y="277.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Current version</text><rect x="665" y="230" width="164" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="747.0" y="253.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Green</text><text x="747.0" y="273.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">environment</text><text x="747.0" y="293.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">New version</text><rect x="360" y="375" width="240" height="74" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="480.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Shared saved information</text><text x="480.0" y="418.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Compatible with both</text><text x="480.0" y="438.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">versions</text><rect x="295.3" y="139.5" width="98.4" height="22" rx="4" fill="white" opacity=".96"/><text x="344.5" y="154.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">live traffic</text><rect x="516.6" y="139.5" width="177.6" height="22" rx="4" fill="white" opacity=".96"/><text x="605.4" y="154.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">switch after validation</text><rect x="294.1" y="309.5" width="98.4" height="22" rx="4" fill="white" opacity=".96"/><text x="343.3" y="324.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">read / write</text><rect x="564.3" y="315.5" width="98.4" height="22" rx="4" fill="white" opacity=".96"/><text x="613.5" y="330.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">read / write</text></svg>
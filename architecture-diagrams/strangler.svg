<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Strangler fig migration</title><desc id="desc">Put a routing facade in front of an existing system. Build new capabilities beside it and gradually move requests to the new parts. The old system keeps operating until nothing needs it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 215.0 227.0 L 350.0 227.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="350.0,227.0 338.0,222.0 338.0,232.0" fill="#566c7d"/><path d="M 530.0 195.8 L 740.0 123.2" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="740.0,123.2 727.0,122.4 730.3,131.8" fill="#566c7d"/><path d="M 530.0 262.8 L 740.0 346.2" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="740.0,346.2 730.7,337.2 727.0,346.4" fill="#566c7d"/><rect x="35" y="190" width="180" height="74" rx="8" fill="#eeeafd" stroke="#6751a6" stroke-width="2"/><text x="125.0" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Client</text><rect x="350" y="190" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="440.0" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Routing facade</text><rect x="740" y="55" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="830.0" y="98.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Existing system</text><rect x="740" y="345" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="830.0" y="388.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">New capability</text><rect x="251.3" y="203.0" width="62.4" height="22" rx="4" fill="white" opacity=".96"/><text x="282.5" y="218.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">request</text><rect x="578.6" y="135.5" width="112.8" height="22" rx="4" fill="white" opacity=".96"/><text x="635.0" y="150.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">remaining work</text><rect x="582.2" y="280.5" width="105.6" height="22" rx="4" fill="white" opacity=".96"/><text x="635.0" y="295.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">migrated work</text></svg>
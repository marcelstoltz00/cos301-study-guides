<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Refresh-ahead cache</title><desc id="desc">Refresh selected cached entries before they expire so popular reads are less likely to wait for a database load. This requires a prediction or schedule for which entries will be needed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 215.0 227.0 L 370.0 227.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="370.0,227.0 358.0,222.0 358.0,232.0" fill="#566c7d"/><path d="M 550.0 227.0 L 735.0 227.0" fill="none" stroke="#566c7d" stroke-width="2" stroke-dasharray="7 5"/><polygon points="735.0,227.0 723.0,222.0 723.0,232.0" fill="#566c7d"/><rect x="35" y="190" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="125.0" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Application</text><rect x="370" y="190" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="460.0" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Cache layer</text><rect x="735" y="190" width="180" height="74" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="825.0" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Source database</text><rect x="272.1" y="203.0" width="40.8" height="22" rx="4" fill="white" opacity=".96"/><text x="292.5" y="218.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">read</text><rect x="589.7" y="203.0" width="105.6" height="22" rx="4" fill="white" opacity=".96"/><text x="642.5" y="218.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">refresh early</text></svg>
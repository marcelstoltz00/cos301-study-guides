<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Coordinator / master–worker</title><desc id="desc">Split a large job into smaller tasks and give them to several workers. A coordinator decides who does what and collects the results. Workers can process independent tasks at the same time, which can shorten the overall job.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 194.0 236.0 L 315.0 236.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="315.0,236.0 303.0,231.0 303.0,241.0" fill="#566c7d"/><path d="M 477.4 205.0 L 731.6 107.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="731.6,107.0 718.6,106.7 722.2,116.0" fill="#566c7d"/><path d="M 479.0 236.0 L 730.0 236.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="730.0,236.0 718.0,231.0 718.0,241.0" fill="#566c7d"/><path d="M 477.4 267.0 L 731.6 365.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="731.6,365.0 722.2,356.0 718.6,365.3" fill="#566c7d"/><rect x="30" y="205" width="164" height="62" rx="8" fill="#eeeafd" stroke="#6751a6" stroke-width="2"/><text x="112.0" y="242.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Task source</text><rect x="315" y="205" width="164" height="62" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="397.0" y="242.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Coordinator</text><rect x="730" y="45" width="164" height="62" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="812.0" y="82.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Worker 1</text><rect x="730" y="205" width="164" height="62" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="812.0" y="242.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Worker 2</text><rect x="730" y="365" width="164" height="62" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="812.0" y="402.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Worker 3</text><rect x="212.5" y="212.0" width="84.0" height="22" rx="4" fill="white" opacity=".96"/><text x="254.5" y="227.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">submit job</text><rect x="551.7" y="132.0" width="105.6" height="22" rx="4" fill="white" opacity=".96"/><text x="604.5" y="147.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">task / result</text><rect x="551.7" y="212.0" width="105.6" height="22" rx="4" fill="white" opacity=".96"/><text x="604.5" y="227.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">task / result</text><rect x="551.7" y="292.0" width="105.6" height="22" rx="4" fill="white" opacity=".96"/><text x="604.5" y="307.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">task / result</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Event sourcing</title><desc id="desc">Persist an ordered stream of domain events and derive state by replaying it. This is a persistence pattern that can pair with command and query responsibility segregation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 194.0 232.8 L 300.0 235.2" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="300.0,235.2 288.1,229.9 287.9,239.9" fill="#566c7d"/><path d="M 464.0 235.2 L 570.0 232.8" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="570.0,232.8 557.9,228.1 558.1,238.1" fill="#566c7d"/><path d="M 734.0 231.0 L 780.0 231.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="780.0,231.0 768.0,226.0 768.0,236.0" fill="#566c7d"/><rect x="30" y="200" width="164" height="62" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="112.0" y="237.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Command handler</text><rect x="300" y="200" width="164" height="74" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="382.0" y="223.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Event store</text><text x="382.0" y="243.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Ordered domain</text><text x="382.0" y="263.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">history</text><rect x="570" y="200" width="164" height="62" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="652.0" y="227.0" text-anchor="middle" font-family="Arial,sans-serif" 
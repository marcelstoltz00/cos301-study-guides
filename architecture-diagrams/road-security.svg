<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Road-security parallel query and response architecture</title><desc id="desc">The road-security case study uses long-lived two-way client connections and event-driven processing. One request becomes several source queries that can run in parallel. Responses are correlated, meaning matched back to the original request, and may be returned separately or combined.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 215.0 92.0 L 355.0 92.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="355.0,92.0 343.0,87.0 343.0,97.0" fill="#566c7d"/><path d="M 535.0 92.0 L 735.0 92.0" fill="none" stroke="#566c7d" stroke-width="2" stroke-dasharray="7 5"/><polygon points="735.0,92.0 723.0,87.0 723.0,97.0" fill="#566c7d"/><path d="M 825.0 129.0 L 825.0 345.0" fill="none" stroke="#566c7d" stroke-width="2" stroke-dasharray="7 5"/><polygon points="825.0,345.0 830.0,333.0 820.0,333.0" fill="#566c7d"/><path d="M 735.0 382.0 L 535.0 382.0" fill="none" stroke="#566c7d" stroke-width="2" stroke-dasharray="7 5"/><polygon points="535.0,382.0 547.0,387.0 547.0,377.0" fill="#566c7d"/><path d="M 404.2 345.0 L 165.8 129.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="165.8,129.0 171.4,140.8 178.1,133.4" fill="#566c7d"/><path d="M 825.0 129.0 L 825.0 275.0 L 125.0 275.0 L 125.0 345.0" fill="none" stroke="#566c7d" stroke-width="2" stroke-dasharray="7 5"/><polygon points="125.0,345.0 130.0,333.0 120.0,333.0" fill="#566c7d"/><rect x="35" y="55" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="125.0" y="88.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Client</text><text x="125.0" y="108.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">communications</text><rect x="355" y="55" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="445.0" y="88.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Request</text><text x="445.0" y="108.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">processing</text><rect x="735" y="55" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="825.0" y="88.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Enterprise</text><text x="825.0" y="108.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">message bus</text><rect x="735" y="345" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="825.0" y="378.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Parallel licence</text><text x="825.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">queries</text><rect x="355" y="345" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="445.0" y="378.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Response</text><text x="445.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">processing</text><rect x="35" y="345" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="125.0" y="388.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Notifications</text><rect x="253.8" y="68.0" width="62.4" height="22" rx
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Single-host deployment</title><desc id="desc">The web entry point, application and database all run on one host. This is simple and cheap, but losing that host loses all three. Separate processes do not create separate machine failure domains.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><rect x="300" y="15" width="350" height="440" rx="12" fill="#f7f9fb" stroke="#91a7b5" stroke-dasharray="6 4"/><text x="314" y="38" font-family="Arial,sans-serif" font-size="14" fill="#4b6272">One physical or virtual host</text><path d="M 208.6 190.0 L 346.4 129.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="346.4,129.0 333.4,129.3 337.5,138.4" fill="#566c7d"/><path d="M 430.0 129.0 L 430.0 205.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="430.0,205.0 435.0,193.0 425.0,193.0" fill="#566c7d"/><path d="M 430.0 279.0 L 430.0 355.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="430.0,355.0 435.0,343.0 425.0,343.0" fill="#566c7d"/><rect x="35" y="190" width="180" height="74" rx="8" fill="#eeeafd" stroke="#6751a6" stroke-width="2"/><text x="125.0" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Browser</text><rect x="340" y="55" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="430.0" y="98.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Reverse proxy</text><rect x="340" y="205" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="430.0" y="238.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Application</text><text x="430.0" y="258.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">process</text><rect x="340" y="355" width="180" height="74" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="430.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Local database</text><rect x="217.5" y="135.5" width="120.0" height="22" rx="4" fill="white" opacity=".96"/><text x="277.5" y="150.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">secure web call</text><rect x="468.0" y="153.0" width="84.0" height="22" rx="4" fill="white" opacity=".96"/><text x="510.0" y="168.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">local call</text><rect x="439.2" y="303.0" width="141.6" height="22" rx="4" fill="white" opacity=".96"/><text x="510.0" y="318.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">local storage call</text></svg>
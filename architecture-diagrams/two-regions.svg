<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Two-region deployment with a legal data boundary</title><desc id="desc">A wider outage can affect an entire region, so another region may hold warm standby capacity. A warm standby runs reduced capacity until needed. Cross-region recovery also has to respect restrictions on where personal information is allowed to be stored.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><rect x="45" y="135" width="265" height="310" rx="12" fill="#f7f9fb" stroke="#91a7b5" stroke-dasharray="6 4"/><text x="59" y="158" font-family="Arial,sans-serif" font-size="14" fill="#4b6272">Active region and its legal rules</text><rect x="630" y="135" width="285" height="310" rx="12" fill="#f7f9fb" stroke="#91a7b5" stroke-dasharray="6 4"/><text x="644" y="158" font-family="Arial,sans-serif" font-size="14" fill="#4b6272">Standby region and its legal rules</text><path d="M 388.5 99.0 L 226.5 205.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="226.5,205.0 239.3,202.6 233.8,194.2" fill="#566c7d"/><path d="M 508.7 99.0 L 691.3 205.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="691.3,205.0 683.4,194.7 678.4,203.3" fill="#566c7d"/><path d="M 170.0 279.0 L 170.0 355.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="170.0,355.0 175.0,343.0 165.0,343.0" fill="#566c7d"/><path d="M 755.0 279.0 L 755.0 355.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="755.0,355.0 760.0,343.0 750.0,343.0" fill="#566c7d"/><path d="M 260.0 392.0 L 665.0 392.0" fill="none" stroke="#566c7d" stroke-width="2" stroke-dasharray="7 5"/><polygon points="665.0,392.0 653.0,387.0 653.0,397.0" fill="#566c7d"/><rect x="355" y="25" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="445.0" y="58.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Global health-</text><text x="445.0" y="78.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">based routing</text><rect x="80" y="205" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="170.0" y="238.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Active regional</text><text x="170.0" y="258.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">application</text><rect x="665" y="205" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="755.0" y="238.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Warm standby</text><text x="755.0" y="258.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">application</text><rect x="80" y="355" width="180" height="74" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="170.0" y="388.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Active-region</text><text x="170.0" y="408.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">database</text><rect x="665" y="355" width="180" height="74" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="755.0" y="388.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Standby-region</text><text x="755.0" y="408.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">database</text><rect x="258.3" y="128.0" width="98.4" height="22" rx="4" fill="white" opacity=".96"/><tex
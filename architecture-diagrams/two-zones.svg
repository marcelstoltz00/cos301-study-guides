<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Two-zone deployment</title><desc id="desc">A load balancer sends traffic to application instances in separate zones. A stateful primary and standby have explicit replication/failover policies. Both zones normally write to the primary; the standby becomes writable only after promotion during failover.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><rect x="100" y="135" width="285" height="315" rx="12" fill="#f7f9fb" stroke="#91a7b5" stroke-dasharray="6 4"/><text x="114" y="158" font-family="Arial,sans-serif" font-size="14" fill="#4b6272">Zone A · separate failure domain</text><rect x="590" y="135" width="285" height="315" rx="12" fill="#f7f9fb" stroke="#91a7b5" stroke-dasharray="6 4"/><text x="604" y="158" font-family="Arial,sans-serif" font-size="14" fill="#4b6272">Zone B · separate failure domain</text><path d="M 432.6 87.0 L 285.0 190.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="285.0,190.0 297.7,187.2 292.0,179.0" fill="#566c7d"/><path d="M 521.4 87.0 L 669.0 190.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="669.0,190.0 662.0,179.0 656.3,187.2" fill="#566c7d"/><path d="M 232.0 264.0 L 232.0 355.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="232.0,355.0 237.0,343.0 227.0,343.0" fill="#566c7d"/><path d="M 640.0 251.2 L 475.0 300.0 L 314.0 357.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="314.0,357.0 327.0,357.7 323.6,348.3" fill="#566c7d"/><path d="M 722.0 264.0 L 722.0 355.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="722.0,355.0 727.0,343.0 717.0,343.0" fill="#566c7d"/><path d="M 314.0 386.0 L 640.0 386.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="640.0,386.0 628.0,381.0 628.0,391.0" fill="#566c7d"/><rect x="395" y="25" width="164" height="62" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="477.0" y="62.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Load balancer</text><rect x="150" y="190" width="164" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="232.0" y="213.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Application</text><text x="232.0" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">replicas · zone</text><text x="232.0" y="253.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">A</text><rect x="640" y="190" width="164" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="722.0" y="213.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Application</text><text x="722.0" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">replicas · zone</text><text x="722.0" y="253.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">B</text><rect x="150" y="355" width="164" height="62" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="232.0" y="392.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">database primary</text><rect x="640" y="355" width="164" height="62" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="722.0" y="392.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">database standby</text><rect x="334.8" y="114.5" width="48.0" height="22" rx="4" fill="white" opacity=".96"/><text x="358.8" y="129.5" text-anc
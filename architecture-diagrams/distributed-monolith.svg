<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Distributed monolith — an architecture to recognise</title><desc id="desc">The application is split into separate running services, but they still depend heavily on one another. A request may need every service to be healthy, or releases may need coordinated changes. This pays the cost of a network without gaining real independence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 215.0 117.0 L 385.0 117.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="385.0,117.0 373.0,112.0 373.0,122.0" fill="#566c7d"/><path d="M 565.0 117.0 L 735.0 117.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="735.0,117.0 723.0,112.0 723.0,122.0" fill="#566c7d"/><path d="M 172.8 154.0 L 432.2 355.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="432.2,355.0 425.8,343.7 419.7,351.6" fill="#566c7d"/><path d="M 475.7 154.0 L 479.3 355.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="479.3,355.0 484.1,342.9 474.1,343.1" fill="#566c7d"/><path d="M 778.6 154.0 L 526.4 355.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="526.4,355.0 538.9,351.4 532.7,343.6" fill="#566c7d"/><rect x="35" y="80" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="125.0" y="123.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Orders service</text><rect x="385" y="80" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="475.0" y="123.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Products service</text><rect x="735" y="80" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="825.0" y="123.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Payments service</text><rect x="340" y="355" width="280" height="74" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="480.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Shared writable database</text><rect x="261.6" y="93.0" width="76.8" height="22" rx="4" fill="white" opacity=".96"/><text x="300.0" y="108.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">must wait</text><rect x="611.6" y="93.0" width="76.8" height="22" rx="4" fill="white" opacity=".96"/><text x="650.0" y="108.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">must wait</text><rect x="157.2" y="256.0" width="105.6" height="22" rx="4" fill="white" opacity=".96"/><text x="210.0" y="271.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">shared tables</text><rect x="527.2" y="286.0" width="105.6" height="22" rx="4" fill="white" opacity=".96"/><text x="580.0" y="301.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">shared tables</text><rect x="697.2" y="256.0" width="105.6" height="22" rx="4" fill="white" opacity=".96"/><text x="750.0" y="271.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">shared tables</text></svg>
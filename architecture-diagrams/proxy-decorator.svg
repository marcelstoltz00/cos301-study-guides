<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Proxy and decorator wrappers</title><desc id="desc">A proxy stands in front of another component and controls access to it. A decorator wraps a component to add behaviour while preserving the same interface. Both can intercept calls for caching, logging or checks; they solve different responsibilities despite a similar drawing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 215.0 227.0 L 370.0 227.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="370.0,227.0 358.0,222.0 358.0,232.0" fill="#566c7d"/><path d="M 550.0 227.0 L 735.0 227.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="735.0,227.0 723.0,222.0 723.0,232.0" fill="#566c7d"/><rect x="35" y="190" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="125.0" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Caller</text><rect x="370" y="190" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="460.0" y="223.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Proxy or</text><text x="460.0" y="243.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">decorator</text><rect x="735" y="190" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="825.0" y="223.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Underlying</text><text x="825.0" y="243.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">component</text><rect x="236.1" y="203.0" width="112.8" height="22" rx="4" fill="white" opacity=".96"/><text x="292.5" y="218.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">same interface</text><rect x="593.3" y="203.0" width="98.4" height="22" rx="4" fill="white" opacity=".96"/><text x="642.5" y="218.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">forward call</text></svg>
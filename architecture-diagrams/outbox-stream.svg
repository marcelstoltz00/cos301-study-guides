<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Transactional outbox, event stream and failed-message handling</title><desc id="desc">Save the business record and an outgoing message in one database transaction. A relay later publishes that saved message. Workers process the resulting stream; messages that repeatedly fail go to a separate holding area for investigation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 215.0 92.0 L 355.0 92.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="355.0,92.0 343.0,87.0 343.0,97.0" fill="#566c7d"/><path d="M 535.0 92.0 L 735.0 92.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="735.0,92.0 723.0,87.0 723.0,97.0" fill="#566c7d"/><path d="M 825.0 129.0 L 825.0 345.0" fill="none" stroke="#566c7d" stroke-width="2" stroke-dasharray="7 5"/><polygon points="825.0,345.0 830.0,333.0 820.0,333.0" fill="#566c7d"/><path d="M 735.0 382.0 L 535.0 382.0" fill="none" stroke="#566c7d" stroke-width="2" stroke-dasharray="7 5"/><polygon points="535.0,382.0 547.0,387.0 547.0,377.0" fill="#566c7d"/><path d="M 355.0 382.0 L 215.0 382.0" fill="none" stroke="#566c7d" stroke-width="2" stroke-dasharray="7 5"/><polygon points="215.0,382.0 227.0,387.0 227.0,377.0" fill="#566c7d"/><rect x="35" y="55" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="125.0" y="98.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Order application</text><rect x="355" y="55" width="180" height="74" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="445.0" y="88.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Database and</text><text x="445.0" y="108.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">outbox</text><rect x="735" y="55" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="825.0" y="98.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Outbox relay</text><rect x="735" y="345" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="825.0" y="378.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Saved event</text><text x="825.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">stream</text><rect x="355" y="345" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="445.0" y="388.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Settlement worker</text><rect x="35" y="345" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="125.0" y="378.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Failed-message</text><text x="125.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">store</text><rect x="232.2" y="68.0" width="105.6" height="22" rx="4" fill="white" opacity=".96"/><text x="285.0" y="83.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">save together</text><rect x="589.4" y="68.0" width="91.2" height="22" rx="4" fill="white" opacity=".96"/><text x="635.0" y="83.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">read outbox</text><rect x="873.8" y="223.0" width="62.4" height="22" rx="4" fill="white" opacity=".96"/><text x="905.0" y="238.0" text-anchor="middle" font-family="Arial
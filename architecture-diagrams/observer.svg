<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Observer and publish–subscribe</title><desc id="desc">A publisher announces a change to registered listeners. Listeners react without the publisher containing their detailed behaviour. A local observer often calls listeners directly; distributed publish–subscribe commonly delivers messages through a broker.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 215.0 227.0 L 365.0 227.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="365.0,227.0 353.0,222.0 353.0,232.0" fill="#566c7d"/><path d="M 545.0 194.2 L 735.0 124.8" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="735.0,124.8 722.0,124.3 725.4,133.6" fill="#566c7d"/><path d="M 543.3 264.0 L 736.7 345.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="736.7,345.0 727.5,335.8 723.7,345.0" fill="#566c7d"/><rect x="35" y="190" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="125.0" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Change publisher</text><rect x="365" y="190" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="455.0" y="223.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Notification</text><text x="455.0" y="243.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">mechanism</text><rect x="735" y="55" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="825.0" y="98.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Order listener</text><rect x="735" y="345" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="825.0" y="378.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Reporting</text><text x="825.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">listener</text><rect x="255.2" y="203.0" width="69.6" height="22" rx="4" fill="white" opacity=".96"/><text x="290.0" y="218.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">announce</text><rect x="612.4" y="135.5" width="55.2" height="22" rx="4" fill="white" opacity=".96"/><text x="640.0" y="150.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">notify</text><rect x="612.4" y="280.5" width="55.2" height="22" rx="4" fill="white" opacity=".96"/><text x="640.0" y="295.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">notify</text></svg>
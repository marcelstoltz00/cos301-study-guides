<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Slow-dependency resilience</title><desc id="desc">Timeouts, breaker and bulkhead limit the effect of a failed provider. Durable pending work can be processed later and reconciled.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 189.0 96.0 L 330.0 96.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="330.0,96.0 318.0,91.0 318.0,101.0" fill="#566c7d"/><path d="M 540.0 96.0 L 740.0 96.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="740.0,96.0 728.0,91.0 728.0,101.0" fill="#566c7d"/><path d="M 107.0 127.0 L 107.0 325.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="107.0,325.0 112.0,313.0 102.0,313.0" fill="#566c7d"/><path d="M 189.0 356.0 L 335.0 356.0" fill="none" stroke="#566c7d" stroke-width="2" stroke-dasharray="7 5"/><polygon points="335.0,356.0 323.0,351.0 323.0,361.0" fill="#566c7d"/><path d="M 499.0 357.3 L 690.0 360.2" fill="none" stroke="#566c7d" stroke-width="2" stroke-dasharray="7 5"/><polygon points="690.0,360.2 678.1,355.0 677.9,365.0" fill="#566c7d"/><path d="M 811.7 325.0 L 820.6 127.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="820.6,127.0 815.1,138.8 825.1,139.2" fill="#566c7d"/><rect x="25" y="65" width="164" height="62" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="107.0" y="102.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Checkout handler</text><rect x="330" y="65" width="210" height="62" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="435.0" y="92.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Timeout + breaker</text><text x="435.0" y="112.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Bounded bulkhead</text><rect x="740" y="65" width="164" height="62" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="822.0" y="92.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">External payment</text><text x="822.0" y="112.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">service</text><rect x="25" y="325" width="164" height="62" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="107.0" y="352.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Pending record</text><text x="107.0" y="372.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">+ message outbox</text><rect x="335" y="325" width="164" height="62" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="417.0" y="362.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Durable queue</text><rect x="690" y="325" width="240" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="810.0" y="348.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Worker + result checking</text><text x="810.0" y="368.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Stable operation</text><text x="810.0" y="388.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">identifier</text><rect x="210.3" y="72.0" width="98.4" height="22" rx="4" fill="white" opacity=".96"/><text x="259.5" y="87.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">bounded call</text><rect x="608.8" y="72.0" width="62.4" heig
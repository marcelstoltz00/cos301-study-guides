<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Provider adapters, strategy and dependency inversion</title><desc id="desc">Business code uses one agreed payment interface. Each provider adapter translates that interface into a provider’s particular calls. A strategy chooses which implementation to use. Dependency inversion means the business depends on the contract rather than a provider’s code.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 215.0 227.0 L 355.0 227.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="355.0,227.0 343.0,222.0 343.0,232.0" fill="#566c7d"/><path d="M 535.0 195.0 L 735.0 124.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="735.0,124.0 722.0,123.3 725.4,132.7" fill="#566c7d"/><path d="M 535.0 263.7 L 735.0 345.3" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="735.0,345.3 725.8,336.1 722.0,345.4" fill="#566c7d"/><rect x="35" y="190" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="125.0" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Booking domain</text><rect x="355" y="190" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="445.0" y="223.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Payment contract</text><text x="445.0" y="243.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Selection rule</text><rect x="735" y="55" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="825.0" y="88.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Provider one</text><text x="825.0" y="108.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">adapter</text><rect x="735" y="345" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="825.0" y="378.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Provider two</text><text x="825.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">adapter</text><rect x="243.0" y="203.0" width="84.0" height="22" rx="4" fill="white" opacity=".96"/><text x="285.0" y="218.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">depends on</text><rect x="607.4" y="135.5" width="55.2" height="22" rx="4" fill="white" opacity=".96"/><text x="635.0" y="150.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">select</text><rect x="607.4" y="280.5" width="55.2" height="22" rx="4" fill="white" opacity=".96"/><text x="635.0" y="295.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">select</text></svg>
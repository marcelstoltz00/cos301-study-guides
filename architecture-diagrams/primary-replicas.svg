<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Primary and replica architecture</title><desc id="desc">One primary database accepts changes. Replicas keep copies of those changes and can answer reads. The overview slide calls this master–slave. It is different from assigning independent jobs to workers: here the copies hold replicated information.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 215.0 92.0 L 355.0 92.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="355.0,92.0 343.0,87.0 343.0,97.0" fill="#566c7d"/><path d="M 535.0 127.1 L 740.0 206.9" fill="none" stroke="#566c7d" stroke-width="2" stroke-dasharray="7 5"/><polygon points="740.0,206.9 730.6,197.9 727.0,207.2" fill="#566c7d"/><path d="M 492.5 129.0 L 782.5 355.0" fill="none" stroke="#566c7d" stroke-width="2" stroke-dasharray="7 5"/><polygon points="782.5,355.0 776.1,343.7 770.0,351.6" fill="#566c7d"/><path d="M 215.0 372.9 L 740.0 261.1" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="740.0,261.1 727.2,258.8 729.3,268.5" fill="#566c7d"/><path d="M 215.0 392.0 L 740.0 392.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="740.0,392.0 728.0,387.0 728.0,397.0" fill="#566c7d"/><rect x="35" y="55" width="180" height="74" rx="8" fill="#eeeafd" stroke="#6751a6" stroke-width="2"/><text x="125.0" y="98.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Writing client</text><rect x="355" y="55" width="180" height="74" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="445.0" y="98.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Primary database</text><rect x="35" y="355" width="180" height="74" rx="8" fill="#eeeafd" stroke="#6751a6" stroke-width="2"/><text x="125.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Reading clients</text><rect x="740" y="205" width="180" height="74" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="830.0" y="248.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Replica one</text><rect x="740" y="355" width="180" height="74" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="830.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Replica two</text><rect x="261.0" y="68.0" width="48.0" height="22" rx="4" fill="white" opacity=".96"/><text x="285.0" y="83.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">write</text><rect x="588.3" y="143.0" width="98.4" height="22" rx="4" fill="white" opacity=".96"/><text x="637.5" y="158.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">copy changes</text><rect x="588.3" y="218.0" width="98.4" height="22" rx="4" fill="white" opacity=".96"/><text x="637.5" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">copy changes</text><rect x="457.1" y="293.0" width="40.8" height="22" rx="4" fill="white" opacity=".96"/><text x="477.5" y="308.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">read</text><rect x="457.1" y="368.0" width="40.8" height="22" rx="4" fill="white" opacity=".96"/><text x="477.5" y="383.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">read</text></svg>
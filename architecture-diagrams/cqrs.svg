<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Command and query responsibility segregation</title><desc id="desc">Commands change authoritative state; queries read an appropriate representation. This example uses an asynchronously maintained read projection.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 179.6 205.0 L 324.4 127.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="324.4,127.0 311.5,128.3 316.2,137.1" fill="#566c7d"/><path d="M 179.6 267.0 L 324.4 345.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="324.4,345.0 316.2,334.9 311.5,343.7" fill="#566c7d"/><path d="M 464.0 96.0 L 700.0 96.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="700.0,96.0 688.0,91.0 688.0,101.0" fill="#566c7d"/><path d="M 464.0 376.0 L 700.0 376.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="700.0,376.0 688.0,371.0 688.0,381.0" fill="#566c7d"/><path d="M 782.0 127.0 L 782.0 345.0" fill="none" stroke="#566c7d" stroke-width="2" stroke-dasharray="7 5"/><polygon points="782.0,345.0 787.0,333.0 777.0,333.0" fill="#566c7d"/><rect x="40" y="205" width="164" height="62" rx="8" fill="#eeeafd" stroke="#6751a6" stroke-width="2"/><text x="122.0" y="232.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">user interface /</text><text x="122.0" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">client</text><rect x="300" y="65" width="164" height="62" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="382.0" y="102.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Command handler</text><rect x="300" y="345" width="164" height="62" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="382.0" y="382.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Query handler</text><rect x="700" y="65" width="164" height="62" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="782.0" y="92.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Write model /</text><text x="782.0" y="112.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">store</text><rect x="700" y="345" width="164" height="62" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="782.0" y="372.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Read projection</text><text x="782.0" y="392.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">/ store</text><rect x="202.8" y="142.0" width="98.4" height="22" rx="4" fill="white" opacity=".96"/><text x="252.0" y="157.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">change state</text><rect x="213.6" y="282.0" width="76.8" height="22" rx="4" fill="white" opacity=".96"/><text x="252.0" y="297.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">read data</text><rect x="518.4" y="72.0" width="127.2" height="22" rx="4" fill="white" opacity=".96"/><text x="582.0" y="87.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">validate + write</text><rect x="558.0" y="352.0" width="48.0" height="22" rx="4" fill="white" opacity=".96"/><text x="582.0" y="367.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">query</text><rect x="794.8" y="222.0" width="134.4" height="22" rx="4" fill="white" opacity=".96"/><text x="862.0" y="237.0" text-anch
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Three tiers with a protected perimeter</title><desc id="desc">An exposed entry tier forwards requests into a private application tier. A further boundary protects the data tier. The outer tier is a perimeter zone: it faces outside traffic while limiting what can reach internal systems.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><rect x="15" y="125" width="230" height="190" rx="12" fill="#f7f9fb" stroke="#91a7b5" stroke-dasharray="6 4"/><text x="29" y="148" font-family="Arial,sans-serif" font-size="14" fill="#4b6272">Public-facing perimeter</text><rect x="365" y="125" width="230" height="190" rx="12" fill="#f7f9fb" stroke="#91a7b5" stroke-dasharray="6 4"/><text x="379" y="148" font-family="Arial,sans-serif" font-size="14" fill="#4b6272">Private application tier</text><rect x="715" y="125" width="230" height="190" rx="12" fill="#f7f9fb" stroke="#91a7b5" stroke-dasharray="6 4"/><text x="729" y="148" font-family="Arial,sans-serif" font-size="14" fill="#4b6272">Protected data tier</text><path d="M 215.0 242.0 L 385.0 242.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="385.0,242.0 373.0,237.0 373.0,247.0" fill="#566c7d"/><path d="M 565.0 242.0 L 735.0 242.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="735.0,242.0 723.0,237.0 723.0,247.0" fill="#566c7d"/><rect x="35" y="205" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="125.0" y="238.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Reverse proxy</text><text x="125.0" y="258.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">copies</text><rect x="385" y="205" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="475.0" y="238.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Application</text><text x="475.0" y="258.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">servers</text><rect x="735" y="205" width="180" height="74" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="825.0" y="238.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Single database</text><text x="825.0" y="258.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">host</text><rect x="232.8" y="218.0" width="134.4" height="22" rx="4" fill="white" opacity=".96"/><text x="300.0" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">allowed web calls</text><rect x="579.2" y="218.0" width="141.6" height="22" rx="4" fill="white" opacity=".96"/><text x="650.0" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">allowed data calls</text></svg>
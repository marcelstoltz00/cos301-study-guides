<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Payment tokenisation with an external vault</title><desc id="desc">The browser sends card details directly to the payment provider’s vault. The platform receives only a token, which is a reference the provider understands. This keeps raw card details outside the platform’s database and application boundary.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 215.0 92.0 L 735.0 92.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="735.0,92.0 723.0,87.0 723.0,97.0" fill="#566c7d"/><path d="M 125.0 129.0 L 125.0 355.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="125.0,355.0 130.0,343.0 120.0,343.0" fill="#566c7d"/><path d="M 215.0 392.0 L 365.0 392.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="365.0,392.0 353.0,387.0 353.0,397.0" fill="#566c7d"/><path d="M 545.0 392.0 L 735.0 392.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="735.0,392.0 723.0,387.0 723.0,397.0" fill="#566c7d"/><path d="M 500.6 355.0 L 779.4 129.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="779.4,129.0 766.9,132.7 773.2,140.4" fill="#566c7d"/><rect x="35" y="55" width="180" height="74" rx="8" fill="#eeeafd" stroke="#6751a6" stroke-width="2"/><text x="125.0" y="98.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Customer browser</text><rect x="735" y="55" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="825.0" y="88.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">External card</text><text x="825.0" y="108.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">vault</text><rect x="35" y="355" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="125.0" y="388.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Booking</text><text x="125.0" y="408.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">application</text><rect x="365" y="355" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="455.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Payment adapter</text><rect x="735" y="355" width="180" height="74" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="825.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Token database</text><rect x="422.2" y="68.0" width="105.6" height="22" rx="4" fill="white" opacity=".96"/><text x="475.0" y="83.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">card directly</text><rect x="163.0" y="228.0" width="84.0" height="22" rx="4" fill="white" opacity=".96"/><text x="205.0" y="243.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">token only</text><rect x="230.0" y="368.0" width="120.0" height="22" rx="4" fill="white" opacity=".96"/><text x="290.0" y="383.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">payment request</text><rect x="598.0" y="368.0" width="84.0" height="22" rx="4" fill="white" opacity=".96"/><text x="640.0" y="383.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">token only</text><rect x="601.6" y="218.0" width="76.8" height="22" rx="4" fill="white" opacity=".96"/><text x="640.0" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">use token</text></svg>
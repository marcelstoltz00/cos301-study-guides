<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Verified service communication and service mesh</title><desc id="desc">Being on an internal network does not automatically make a caller trustworthy. Services verify identity and permissions for each protected interaction. A service mesh supplies communication controls around services, often using companion proxies; it does not replace business-level permission checks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 211.3 190.0 L 353.7 129.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="353.7,129.0 340.7,129.1 344.6,138.3" fill="#566c7d"/><path d="M 530.0 92.0 L 735.0 92.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="735.0,92.0 723.0,87.0 723.0,97.0" fill="#566c7d"/><path d="M 440.0 129.0 L 440.0 345.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="440.0,345.0 445.0,333.0 435.0,333.0" fill="#566c7d"/><path d="M 530.0 382.0 L 735.0 382.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="735.0,382.0 723.0,377.0 723.0,387.0" fill="#566c7d"/><rect x="35" y="190" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="125.0" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Request gateway</text><rect x="350" y="55" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="440.0" y="88.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Communication</text><text x="440.0" y="108.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">proxy</text><rect x="735" y="55" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="825.0" y="98.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Service one</text><rect x="350" y="345" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="440.0" y="378.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Communication</text><text x="440.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">proxy</text><rect x="735" y="345" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="825.0" y="388.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Service two</text><rect x="226.1" y="135.5" width="112.8" height="22" rx="4" fill="white" opacity=".96"/><text x="282.5" y="150.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">verified entry</text><rect x="576.1" y="68.0" width="112.8" height="22" rx="4" fill="white" opacity=".96"/><text x="632.5" y="83.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">protected call</text><rect x="445.6" y="223.0" width="148.8" height="22" rx="4" fill="white" opacity=".96"/><text x="520.0" y="238.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">verified identities</text><rect x="576.1" y="358.0" width="112.8" height="22" rx="4" fill="white" opacity=".96"/><text x="632.5" y="373.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">protected call</text></svg>
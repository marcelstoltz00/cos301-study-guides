<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Hybrid layered, event-driven and model-training system</title><desc id="desc">The slide combines a model–view–view-model screen, protected service entry, event-driven specialist services and saved data. A system does not have to choose exactly one style for every part. This practice diagram keeps the main responsibilities and simplifies the detailed training pipelines.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 215.0 92.0 L 355.0 92.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="355.0,92.0 343.0,87.0 343.0,97.0" fill="#566c7d"/><path d="M 535.0 92.0 L 735.0 92.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="735.0,92.0 723.0,87.0 723.0,97.0" fill="#566c7d"/><path d="M 825.0 129.0 L 825.0 345.0" fill="none" stroke="#566c7d" stroke-width="2" stroke-dasharray="7 5"/><polygon points="825.0,345.0 830.0,333.0 820.0,333.0" fill="#566c7d"/><path d="M 735.0 382.0 L 535.0 382.0" fill="none" stroke="#566c7d" stroke-width="2" stroke-dasharray="7 5"/><polygon points="535.0,382.0 547.0,387.0 547.0,377.0" fill="#566c7d"/><path d="M 355.0 382.0 L 215.0 382.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="215.0,382.0 227.0,387.0 227.0,377.0" fill="#566c7d"/><rect x="35" y="55" width="180" height="74" rx="8" fill="#eeeafd" stroke="#6751a6" stroke-width="2"/><text x="125.0" y="88.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">View and view</text><text x="125.0" y="108.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">model</text><rect x="355" y="55" width="180" height="74" rx="8" fill="#e6eff9" stroke=
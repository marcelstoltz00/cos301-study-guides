<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Saga with orchestration</title><desc id="desc">A coordinator tracks a business process across several services. Each service saves its own changes; failures trigger compensating actions instead of one transaction rolling everything back.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 417.2 112.0 L 182.3 295.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="182.3,295.0 194.9,291.6 188.7,283.7" fill="#566c7d"/><path d="M 458.8 112.0 L 469.3 295.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="469.3,295.0 473.6,282.7 463.6,283.3" fill="#566c7d"/><path d="M 500.7 112.0 L 758.6 295.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="758.6,295.0 751.7,284.0 745.9,292.1" fill="#566c7d"/><rect x="375" y="50" width="164" height="62" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="457.0" y="87.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Saga coordinator</text><rect x="40" y="295" width="164" height="94" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="122.0" y="318.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">1. Reserve</text><text x="122.0" y="338.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">inventory</text><text x="122.0" y="358.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Own local</text><text x="122.0" y="378.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">transaction</text><rect x="390" y="295" width="164" height="94" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="472.0" y="318.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">2. Charge</text><text x="472.0" y="338.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">payment</text><text x="472.0" y="358.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Own local</text><text x="472.0" y="378.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">transaction</text><rect x="740" y="295" width="164" height="90" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="822.0" y="326.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">3. Confirm order</text><text x="822.0" y="346.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Own local</text><text x="822.0" y="366.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">transaction</text><rect x="232.6" y="179.5" width="134.4" height="22" rx="4" fill="white" opacity=".96"/><text x="299.8" y="194.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">reserve / release</text><rect x="495.0" y="231.0" width="120.0" height="22" rx="4" fill="white" opacity=".96"/><text x="555.0" y="246.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">charge / refund</text><rect x="566.0" y="179.5" width="127.2" height="22" rx="4" fill="white" opacity=".96"/><text x="629.6" y="194.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">confirm / result</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Devices, external services and incoming callbacks</title><desc id="desc">Clients call the platform, and the platform calls an external provider. The provider can also send a later callback, often called a webhook, to report a result. That incoming request crosses the public trust boundary and must be checked.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 215.0 92.0 L 355.0 92.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="355.0,92.0 343.0,87.0 343.0,97.0" fill="#566c7d"/><path d="M 535.0 92.0 L 735.0 92.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="735.0,92.0 723.0,87.0 723.0,97.0" fill="#566c7d"/><path d="M 825.0 129.0 L 825.0 345.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="825.0,345.0 830.0,333.0 820.0,333.0" fill="#566c7d"/><path d="M 735.0 382.0 L 535.0 382.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="535.0,382.0 547.0,387.0 547.0,377.0" fill="#566c7d"/><path d="M 355.0 382.0 L 215.0 382.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="215.0,382.0 227.0,387.0 227.0,377.0" fill="#566c7d"/><rect x="35" y="55" width="180" height="74" rx="8" fill="#eeeafd" stroke="#6751a6" stroke-width="2"/><text x="125.0" y="88.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Browser and</text><text x="125.0" y="108.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">mobile devices</text><rect x="355" y="55" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="445.0" y="98.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Request gateway</text><rect x="735" y="55" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="825.0" y="98.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Order service</text><rect x="735" y="345" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="825.0" y="378.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">External payment</text><text x="825.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">provider</text><rect x="355" y="345" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="445.0" y="388.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Callback receiver</text><rect x="35" y="345" width="180" height="74" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="125.0" y="388.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Order database</text><rect x="228.6" y="68.0" width="112.8" height="22" rx="4" fill="white" opacity=".96"/><text x="285.0" y="83.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">secure request</text><rect x="575.0" y="68.0" width="120.0" height="22" rx="4" fill="white" opacity=".96"/><text x="635.0" y="83.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">checked request</text><rect x="832.0" y="223.0" width="120.0" height="22" rx="4" fill="white" opacity=".96"/><text x="892.0" y="238.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">payment request</text><rect x="575.0" y="358.0" width="120.0" height="22" rx="4" fill="white" opacity=".96"/><text x="635.0" y="373.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">signed callback</text><rect x="232.2" y="358.0" width="105.6" height="22" rx="4" fill="white" opacity=".96"/><text x="285.0" y="373.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">record result</text></svg>
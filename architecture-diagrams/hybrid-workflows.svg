<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Client presenter with server-side workflow orchestration</title><desc id="desc">A presenter manages the client screen. The server contains a gatekeeper, gateway, scheduler and workflow coordinator. Business services use saved data, while cache and logging support the server. This combines client presentation separation with centrally coordinated server workflows.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 215.0 92.0 L 355.0 92.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="355.0,92.0 343.0,87.0 343.0,97.0" fill="#566c7d"/><path d="M 535.0 92.0 L 735.0 92.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="735.0,92.0 723.0,87.0 723.0,97.0" fill="#566c7d"/><path d="M 215.0 382.0 L 355.0 382.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="355.0,382.0 343.0,377.0 343.0,387.0" fill="#566c7d"/><path d="M 493.5 345.0 L 776.5 129.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="776.5,129.0 763.9,132.3 770.0,140.3" fill="#566c7d"/><path d="M 825.0 129.0 L 825.0 345.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="825.0,345.0 830.0,333.0 820.0,333.0" fill="#566c7d"/><rect x="35" y="55" width="180" height="74" rx="8" fill="#eeeafd" stroke="#6751a6" stroke-width="2"/><text x="125.0" y="88.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">View and</text><text x="125.0" y="108.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">presenter</text><rect x="355" y="55" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="445.0" y="88.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Gatekeeper and</text><text x="445.0" y="108.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">gateway</text><rect x="735" y="55" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="825.0" y="98.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Business services</text><rect x="35" y="345" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="125.0" y="388.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Scheduler</text><rect x="355" y="345" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="445.0" y="378.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Workflow</text><text x="445.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">coordinator</text><rect x="735" y="345" width="180" height="74" rx="16" fill="#fff2d6" stroke="#ad7927" stroke-width="2"/><text x="825.0" y="378.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Saved records,</text><text x="825.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">cache and logs</text><rect x="257.4" y="68.0" width="55.2" height="22" rx="4" fill="white" opacity=".96"/><text x="285.0" y="83.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">action</text><rect x="567.8" y="68.0" width="134.4" height="22" rx="4" fill="white" opacity=".96"/><text x="635.0" y="83.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">allowed operation</text><rect x="232.2" y="358.0" width="105
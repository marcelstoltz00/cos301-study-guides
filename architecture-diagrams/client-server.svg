<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Client–server</title><desc id="desc">Clients request a capability from a server. This interaction can appear inside several other architectural styles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 264.0 146.8 L 620.0 215.2" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="620.0,215.2 609.2,208.1 607.3,217.9" fill="#566c7d"/><path d="M 264.0 315.2 L 620.0 246.8" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="620.0,246.8 607.3,244.1 609.2,253.9" fill="#566c7d"/><rect x="100" y="100" width="164" height="62" rx="8" fill="#eeeafd" stroke="#6751a6" stroke-width="2"/><text x="182.0" y="137.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Web client</text><rect x="100" y="300" width="164" height="62" rx="8" fill="#eeeafd" stroke="#6751a6" stroke-width="2"/><text x="182.0" y="337.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Mobile client</text><rect x="620" y="200" width="164" height="62" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="702.0" y="237.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Shared server</text><rect x="410.8" y="157.0" width="62.4" height="22" rx="4" fill="white" opacity=".96"/><text x="442.0" y="172.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">request</text><rect x="410.8" y="257.0" width="62.4" height="22" rx="4" fill="white" opacity=".96"/><text x="442.0" y="272.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">request</text></svg>
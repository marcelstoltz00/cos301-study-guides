<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Model-assisted processing with validation and fallback</title><desc id="desc">A generated answer can vary even when the input looks similar. Put controlled access, validation and a fallback around model calls instead of assuming every answer is correct. This is a supporting arrangement for the model component discussed in the slides, rather than a separate universal architecture style.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566c7d"/></marker></defs><rect width="960" height="500" fill="white"/><path d="M 215.0 92.0 L 385.0 92.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="385.0,92.0 373.0,87.0 373.0,97.0" fill="#566c7d"/><path d="M 565.0 92.0 L 735.0 92.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="735.0,92.0 723.0,87.0 723.0,97.0" fill="#566c7d"/><path d="M 825.0 129.0 L 825.0 345.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="825.0,345.0 830.0,333.0 820.0,333.0" fill="#566c7d"/><path d="M 780.3 129.0 L 519.7 345.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="519.7,345.0 532.1,341.2 525.7,333.5" fill="#566c7d"/><path d="M 475.0 129.0 L 475.0 345.0" fill="none" stroke="#566c7d" stroke-width="2"/><polygon points="475.0,345.0 480.0,333.0 470.0,333.0" fill="#566c7d"/><rect x="35" y="55" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="125.0" y="98.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Application</text><rect x="385" y="55" width="180" height="74" rx="8" fill="#e6eff9" stroke="#3c6d9c" stroke-width="2"/><text x="475.0" y="88.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Protected model</text><text x="475.0" y="108.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">call</text><rect x="735" y="55" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="825.0" y="88.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Response</text><text x="825.0" y="108.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">validator</text><rect x="735" y="345" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="825.0" y="378.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Approved business</text><text x="825.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">action</text><rect x="385" y="345" width="180" height="74" rx="8" fill="#e4f4ee" stroke="#257c64" stroke-width="2"/><text x="475.0" y="378.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">Fallback or human</text><text x="475.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#223c4d">review</text><rect x="268.8" y="68.0" width="62.4" height="22" rx="4" fill="white" opacity=".96"/><text x="300.0" y="83.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">request</text><rect x="586.4" y="68.0" width="127.2" height="22" rx="4" fill="white" opacity=".96"/><text x="650.0" y="83.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">generated result</text><rect x="870.2" y="223.0" width="69.6" height="22" rx="4" fill="white" opacity=".96"/><text x="905.0" y="238.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#42596a">accepted</text><rect x="615.2" y="213.0" width="69.6" height="22" rx="4" 